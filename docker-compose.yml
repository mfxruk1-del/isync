# Docker Compose runs your whole app with one command.
# Phase 0: just Caddy, serving a placeholder page over automatic HTTPS.
# Later phases will add the API and the PWA frontend as more services here.

services:
  caddy:
    image: caddy:2-alpine
    container_name: vault-caddy
    restart: unless-stopped
    ports:
      - "80:80"     # HTTP  (Caddy auto-redirects this to HTTPS)
      - "443:443"   # HTTPS
    env_file:
      - .env
    volumes:
      # Our Caddy config (read-only).
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The static site Caddy serves (read-only). Phase 0 = the placeholder.
      - ./placeholder:/srv:ro
      # Persisted certificates + Caddy state, so HTTPS survives restarts.
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:

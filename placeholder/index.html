<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f17" />
    <title>Vault — coming online</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: radial-gradient(1200px 800px at 50% -10%, #16203a 0%, #0b0f17 60%);
        color: #e7ecf5;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
      }
      .card {
        max-width: 560px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 20px;
        padding: 40px 32px;
        backdrop-filter: blur(8px);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #8ad4a0;
        background: rgba(138, 212, 160, 0.1);
        border: 1px solid rgba(138, 212, 160, 0.25);
        padding: 6px 12px;
        border-radius: 999px;
        margin-bottom: 22px;
      }
      .dot {
        width: 8px; height: 8px; border-radius: 50%;
        background: #8ad4a0;
        box-shadow: 0 0 0 0 rgba(138, 212, 160, 0.7);
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(138, 212, 160, 0.6); }
        70% { box-shadow: 0 0 0 10px rgba(138, 212, 160, 0); }
        100% { box-shadow: 0 0 0 0 rgba(138, 212, 160, 0); }
      }
      h1 { font-size: 28px; margin: 0 0 10px; }
      p { color: #aab4c5; line-height: 1.6; margin: 0 0 8px; }
      .lock { font-size: 40px; margin-bottom: 8px; }
      .foot { margin-top: 24px; font-size: 12px; color: #6b7689; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="lock">🔒</div>
      <div class="badge"><span class="dot"></span> Secure connection live</div>
      <h1>Your Vault is being built</h1>
      <p>This is your private, self-hosted media vault.</p>
      <p>If you're seeing this over <strong>https://</strong> with a padlock in the address bar, Phase&nbsp;0 worked — the foundation is solid. 🎉</p>
      <div class="foot">Phase 0 · foundation &amp; HTTPS · powered by Caddy + Docker</div>
    </main>
  </body>
</html>
